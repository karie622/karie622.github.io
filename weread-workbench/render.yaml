# Render 一键部署配置
# 部署方式：在 Render 后台 New → Blueprint → 连接本仓库（含此文件），即可自动识别。
services:
  - type: web
    name: weread-workbench
    rootDir: weread-workbench
    runtime: python
    plan: free
    buildCommand: "true"
    startCommand: "python server.py --host 0.0.0.0"
    healthCheckPath: /api/health
    envVars:
      - key: WEREAD_API_KEY
        sync: false          # 部署后在 Render 后台手动填入你的微信读书 Key
      - key: PUBLIC_URL
        sync: false          # 部署后填入 Render 分配的公网地址，如 https://weread-workbench.onrender.com
      - key: PYTHON_VERSION
        value: "3.13"
